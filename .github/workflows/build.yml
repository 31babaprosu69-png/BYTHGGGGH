name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8
      - name: Build
        run: gradle build --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Upload build log (so errors can be read without opening Actions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LovsPlayer-forge-1.20.1
          path: build/libs/*.jar
